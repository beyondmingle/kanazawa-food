<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お店を探す（ホーム用アイコン）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<script>
/* ============================================================
   設定（ここだけ書き換える）
   Google Sites で公開した「お店を探す」ページの URL（公開後のアドレス。編集画面の URL ではない）
   ============================================================ */
const SEARCH_PAGE_URL    = "https://beyondmingle.github.io/kanazawa-food-images/search.html";
const SEARCH_PAGE_URL_EN = "https://beyondmingle.github.io/kanazawa-food-images/search-en.html";
</script>
<style>
:root {
  --ink: #4a3b32;
  --sky: #3fa7c4;
  --sky-dark: #2f8ea9;
  --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { font-family: var(--font); color: var(--ink); line-height: 1.5; padding: 8px 8px 16px; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

.icons {
  list-style: none; margin: 0 auto; padding: 0; max-width: 760px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
}
.icon {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 10px 4px 12px; border-radius: 18px;
  color: var(--ink); text-decoration: none;
  transition: background-color .15s;
}
.icon:hover { background: rgba(63, 167, 196, .08); }
.icon img { width: 112px; height: 112px; transition: transform .2s; }
.icon:hover img { transform: translateY(-3px); }
.icon span { font-weight: 700; font-size: .98rem; text-align: center; }

.more { text-align: center; margin-top: 18px; }
.more a {
  display: inline-block; padding: 10px 34px; border-radius: 999px;
  background: var(--sky); color: #fff; font-weight: 700; text-decoration: none;
  box-shadow: 0 4px 0 var(--sky-dark);
}
.more a:hover { background: var(--sky-dark); }
.more a:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--sky-dark); }

@media (max-width: 560px) {
  body { padding: 4px 2px 12px; }
  .icons { gap: 2px; }
  .icon { padding: 6px 2px 8px; gap: 6px; }
  .icon img { width: 68px; height: 68px; }
  .icon span { font-size: .78rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<ul class="icons" id="icons"></ul>
<p class="more" id="more-wrap"><a id="more" href="#"></a></p>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const LANG = params.get("lang") === "en" ? "en" : "ja";
  document.documentElement.lang = LANG;
  const TARGET = LANG === "en" ? SEARCH_PAGE_URL_EN : SEARCH_PAGE_URL;
  const HANDOFF_KEY = "kanazawa-food:initial"; // search.html と同じ名前にしておく

  const ICONS = [
    { f: 1, icon: "site/icon_egg_milk_free.png", ja: "卵・乳なしの<br>メニューあり", en: "Egg &amp; dairy-free<br>menu" },
    { f: 2, icon: "site/icon_wheat_free.png",    ja: "小麦なしの<br>メニューあり",   en: "Wheat-free<br>menu" },
    { f: 3, icon: "site/icon_vegetarian.png",    ja: "ベジタリアン<br>対応",          en: "Vegetarian<br>friendly" },
    { f: 4, icon: "site/icon_vegan.png",         ja: "ヴィーガン<br>対応",            en: "Vegan<br>friendly" },
  ];

  document.getElementById("icons").innerHTML = ICONS.map(i =>
    `<li><a class="icon" href="${TARGET}" target="_top" data-f="${i.f}"><img src="${i.icon}" alt=""><span>${i[LANG]}</span></a></li>`
  ).join("");
  const more = document.getElementById("more");
  more.textContent = LANG === "en" ? "Search with more conditions" : "詳しい条件で探す";
  more.href = TARGET;
  more.target = "_top";
  if (params.get("more") === "0") document.getElementById("more-wrap").hidden = true;

  // 押されたら、絞り込み条件を検索ページに引き継いでから、Google Sites の「お店を探す」ページへ移動する
  document.addEventListener("click", e => {
    const a = e.target.closest("a[target=_top]");
    if (!a) return;
    e.preventDefault();
    try {
      localStorage.setItem(HANDOFF_KEY, JSON.stringify({ f: a.dataset.f || "", t: Date.now() }));
    } catch (err) { /* 保存できない環境では、条件なしで検索ページを開く */ }
    try {
      window.top.location.href = TARGET;
    } catch (err) {
      window.open(TARGET, "_blank", "noopener"); // 埋め込み先がページ移動を許さない場合は新しいタブで開く
    }
  });
})();
</script>
</body>
</html>
